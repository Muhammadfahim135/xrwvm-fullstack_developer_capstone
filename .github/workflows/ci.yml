name: 'Lint Code'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Configure flake8
        run: |
          cat << 'EOF' > .flake8
          [flake8]
          ignore = E501,W391,E303,F401,F841
          exclude = .git,__pycache__,node_modules
          max-line-length = 127
          EOF

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: |
          # This command finds all Python files recursively and runs flake8 on them
          find server -name "*.py" -exec flake8 {} +
          echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JSHint
        run: npm install jshint --global

      - name: Configure JSHint
        run: |
          cat << 'EOF' > .jshintrc
          {
            "esversion": 8,
            "node": true,
            "sub": true,
            "asi": true
          }
          EOF

      - name: Run Linter
        run: |
          # This command finds all JavaScript files recursively and runs JSHint on them
          find ./server/database -name "*.js" -exec jshint {} +
          echo "Linted all the js files successfully"
